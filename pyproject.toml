[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-event-redrive"
version = "0.1.0"
description = "A typed media event receiver with Infrai delivery inspection and queue redrive"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["infrai_client", "media_delivery"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
